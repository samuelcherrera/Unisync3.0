<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniSync - Gestor de Tareas</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto Condensed', sans-serif;
        }

        body {
            background-color: #f5f5f5;
        }

        .header {
            background-color: #00d4d4;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        .logo {
            display: flex;
            align-items: center;
        }

            .logo svg {
                height: 30px;
                margin-right: 10px;
            }

        .logo-text {
            font-size: 24px;
            font-weight: bold;
        }

        .user-profile {
            background-color: white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .notification-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .notification-badge {
            background-color: #00d4d4;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
        }

            .notification-badge svg {
                margin-right: 5px;
                width: 16px;
                height: 16px;
            }

        .add-task-btn {
            background-color: #00d4d4;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            border: none;
            font-size: 14px;
            cursor: pointer;
        }

        .task-list {
            list-style: none;
        }

        .task-item {
            background-color: #00d4d4;
            border-radius: 10px;
            margin-bottom: 15px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        .task-content {
            display: flex;
            align-items: flex-start;
        }

        .checkbox {
            width: 20px;
            height: 20px;
            border-radius: 5px;
            background-color: white;
            margin-right: 15px;
            cursor: pointer;
        }

        .task-details {
            color: white;
        }

        .task-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .task-description {
            font-size: 14px;
        }

        .task-meta {
            display: flex;
            gap: 10px;
        }

        .date-picker,
        .priority-level {
            background-color: white;
            border-radius: 20px;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            font-size: 14px;
            color: #00d4d4;
        }

        /* MODAL */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 212, 212, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

            .modal.hidden {
                display: none;
            }

        .modal-content {
            background: white;
            border-radius: 10px;
            padding: 30px;
            width: 400px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.2);
        }

            .modal-content label {
                font-weight: bold;
            }

            .modal-content input[type="text"],
            .modal-content input[type="date"] {
                border: 2px solid #00d4d4;
                border-radius: 10px;
                padding: 8px;
            }

        .priority-options {
            display: flex;
            gap: 10px;
        }

        .priority-btn {
            border: none;
            padding: 10px 15px;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            background-color: #00d4d4;
        }

            .priority-btn.active {
                background-color: #008c8c;
            }

        .modal-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }

            .modal-actions button {
                padding: 10px 15px;
                border-radius: 20px;
                border: none;
                color: white;
                background-color: #00d4d4;
                cursor: pointer;
            }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <svg width="30" height="30" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" stroke="white" stroke-width="5" /><path d="M30 50 C 30 30, 70 30, 70 50 C 70 70, 30 70, 30 50" stroke="white" stroke-width="5" fill="none" /><path d="M30 50 C 30 70, 70 70, 70 50" stroke="white" stroke-width="5" fill="none" /></svg>
            <span class="logo-text">UniSync</span>
        </div>
        <div class="user-profile">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="#00d4d4"><circle cx="12" cy="8" r="5" /><path d="M3 21 C3 16, 7 14, 12 14 C17 14, 21 16, 21 21" /></svg>
        </div>
    </header>

    <div class="container">
        <div class="notification-bar">
            <div class="notification-badge">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z" /></svg>
                NOTIFICACIONES
            </div>
            <button class="add-task-btn">AGREGAR TAREA</button>
        </div>

        <ul class="task-list" id="taskList"></ul>
    </div>

    <!-- MODAL -->
    <div id="taskModal" class="modal hidden">
        <div class="modal-content">
            <label>TAREA:</label>
            <input type="text" id="taskName" placeholder="Nombre de la tarea">
            <label>DESCRIPCIÓN DE LA TAREA:</label>
            <input type="text" id="taskDesc" placeholder="Descripción...">
            <label>FECHA DE ENTREGA:</label>
            <input type="date" id="taskDate">
            <label>PRIORIDAD:</label>
            <div class="priority-options">
                <button class="priority-btn" data-priority="Baja">BAJA</button>
                <button class="priority-btn" data-priority="Media">MEDIA</button>
                <button class="priority-btn" data-priority="Alta">ALTA</button>
            </div>
            <div class="modal-actions">
                <button id="cancelModal">CANCELAR</button>
                <button id="addTaskConfirm">AGREGAR</button>
            </div>
        </div>
    </div>

    <script>
        //localStorage.removeItem("tasks");

        const modal = document.getElementById("taskModal");
        const addBtn = document.querySelector(".add-task-btn");
        const cancelBtn = document.getElementById("cancelModal");
        const confirmBtn = document.getElementById("addTaskConfirm");
        const taskList = document.getElementById("taskList");
        const priorityBtns = document.querySelectorAll(".priority-btn");

        let selectedPriority = "";

        priorityBtns.forEach(btn => {
            btn.addEventListener("click", () => {
                priorityBtns.forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                selectedPriority = btn.getAttribute("data-priority");
            });
        });

        addBtn.addEventListener("click", () => modal.classList.remove("hidden"));
        cancelBtn.addEventListener("click", () => modal.classList.add("hidden"));

        confirmBtn.addEventListener("click", () => {
            const task = {
                name: document.getElementById("taskName").value,
                desc: document.getElementById("taskDesc").value,
                date: document.getElementById("taskDate").value,
                priority: selectedPriority
            };

            if (!task.name || !task.date || !task.priority) {
                alert("Por favor completa todos los campos obligatorios.");
                return;
            }

            const tasks = JSON.parse(localStorage.getItem("tasks") || "[]");
            tasks.push(task);
            localStorage.setItem("tasks", JSON.stringify(tasks));
            renderTasks();
            modal.classList.add("hidden");
            clearForm();
        });

        function renderTasks() {
            const tasks = JSON.parse(localStorage.getItem("tasks") || "[]");
            taskList.innerHTML = "";
            tasks.forEach(task => {
                const li = document.createElement("li");
                li.className = "task-item";
                li.innerHTML = `
              <div class="task-content">
                <div class="checkbox"></div>
                <div class="task-details">
                  <div class="task-title">${task.name}</div>
                  <div class="task-description">${task.desc}</div>
                </div>
              </div>
              <div class="task-meta">
                <div class="date-picker">${task.date}</div>
                <div class="priority-level">${task.priority}</div>
              </div>
            `;
                taskList.appendChild(li);
            });
        }

        function clearForm() {
            document.getElementById("taskName").value = "";
            document.getElementById("taskDesc").value = "";
            document.getElementById("taskDate").value = "";
            selectedPriority = "";
            priorityBtns.forEach(b => b.classList.remove("active"));
        }

        window.addEventListener("DOMContentLoaded", renderTasks);
    </script>
</body>
</html>
