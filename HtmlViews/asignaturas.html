<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Asignatura</title>
    <link rel="stylesheet" href="styles/asignaturas.css">

    <script src="../Scripts/Custom/asignaturas.js" defer></script>
</head>
<body>
    <h2>Registrar nueva asignatura</h2>
    <form id="formAsignatura">

        <input type="text" id="nombre" placeholder="Nombre"required><br><br>

        <input type="text" id="docente"placeholder="Docente" required><br><br>

        <input type="text" id="aula" placeholder="Aula"required><br><br>

        <button type="submit">Guardar</button>
    </form>

    <div id="mensaje"></div>
</body>
</html>
