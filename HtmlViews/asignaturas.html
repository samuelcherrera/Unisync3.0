<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Asignatura</title>
    <script src="../Scripts/Custom/asignaturas.js" defer></script>
</head>
<body>
    <h2>Registrar nueva asignatura</h2>
    <form id="formAsignatura">
        <label>Nombre:</label><br>
        <input type="text" id="nombre" required><br><br>

        <label>Docente:</label><br>
        <input type="text" id="docente" required><br><br>

        <label>Aula:</label><br>
        <input type="text" id="aula" required><br><br>

        <button type="submit">Guardar</button>
    </form>

    <div id="mensaje"></div>
</body>
</html>
